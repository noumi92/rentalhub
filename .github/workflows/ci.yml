name: RentalHub CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  lint_and_test:
    name: Lint & Automated Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project (Lint)
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Overflow Tests
        run: flutter test

  build_android:
    name: Build Android APK
    needs: lint_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h
          free -h

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Limit Gradle memory (runner has ~7 GB RAM)
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
          org.gradle.daemon=false
          org.gradle.parallel=false
          kotlin.daemon.jvmargs=-Xmx1g
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (debug key, arm64 only)
        run: flutter build apk --release --target-platform android-arm64

      - name: Check cPanel Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.CPANEL_FTP_SERVER }}" ]; then
            echo "has_cpanel=true" >> $GITHUB_OUTPUT
            echo "cPanel server configured: ${{ secrets.CPANEL_FTP_SERVER }}"
          else
            echo "has_cpanel=false" >> $GITHUB_OUTPUT
            echo "CPANEL_FTP_SERVER secret not configured. Skipping APK upload to cPanel."
          fi

      - name: Prepare APK distribution files
        if: steps.check_secrets.outputs.has_cpanel == 'true' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p apk-dist
          cp build/app/outputs/flutter-apk/app-release.apk apk-dist/app-release.apk
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/ //g')
          version_name=${version%%+*}
          version_code=${version##*+}
          cat > apk-dist/version.json <<EOF
          {
            "app": "rentalhub",
            "versionName": "$version_name",
            "versionCode": $version_code,
            "build": ${{ github.run_number }},
            "commit": "${{ github.sha }}",
            "apk": "app-release.apk",
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload APK to cPanel via FTP
        if: steps.check_secrets.outputs.has_cpanel == 'true' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: ${{ secrets.CPANEL_DEV_ADMIN_PATH }}/apk/
          local-dir: apk-dist/
          protocol: ${{ secrets.CPANEL_FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          timeout: 60000
          security: 'loose'
          dangerous-clean-slate: false

  build_web_admin:
    name: Build Flutter Web Admin Panel
    needs: lint_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Flutter Web Bundle
        run: flutter build web --release --base-href "/"

      - name: Copy Admin SPA .htaccess
        run: cp web/.htaccess build/web/.htaccess || true

      - name: Check cPanel Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.CPANEL_FTP_SERVER }}" ]; then
            echo "has_cpanel=true" >> $GITHUB_OUTPUT
            echo "cPanel server configured: ${{ secrets.CPANEL_FTP_SERVER }}"
          else
            echo "has_cpanel=false" >> $GITHUB_OUTPUT
            echo "CPANEL_FTP_SERVER secret not configured. Skipping automated cPanel deployment."
          fi

      - name: Deploy Web Admin to cPanel via lftp
        if: steps.check_secrets.outputs.has_cpanel == 'true' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CPANEL_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          CPANEL_PROTO: ${{ secrets.CPANEL_FTP_PROTOCOL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          PROTO="${CPANEL_PROTO:-ftp}"
          PORT="${CPANEL_PORT:-21}"

          echo "Deploying Web Admin to cPanel root via $PROTO:$PORT..."

          if [ "$PROTO" = "sftp" ]; then
            lftp -u "$CPANEL_USER","$CPANEL_PASS" -p "$PORT" "sftp://$CPANEL_SERVER" <<EOF
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 3
          mirror -R --verbose -x '^storage/' -x '^cgi-bin/' -x '^\.well-known/' build/web/ ./
          quit
          EOF
          else
            lftp -u "$CPANEL_USER","$CPANEL_PASS" -p "$PORT" "$CPANEL_SERVER" <<EOF
          set ftp:ssl-allow true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          mirror -R --verbose -x '^storage/' -x '^cgi-bin/' -x '^\.well-known/' build/web/ ./
          quit
          EOF
          fi

  deploy_cpanel_storage:
    name: Deploy Storage Server to cPanel
    needs: lint_and_test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check cPanel Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.CPANEL_FTP_SERVER }}" ]; then
            echo "has_cpanel=true" >> $GITHUB_OUTPUT
            echo "cPanel server configured: ${{ secrets.CPANEL_FTP_SERVER }}"
          else
            echo "has_cpanel=false" >> $GITHUB_OUTPUT
            echo "CPANEL_FTP_SERVER secret not configured. Skipping automated cPanel deployment."
          fi

      - name: Deploy Storage Backend via lftp
        if: steps.check_secrets.outputs.has_cpanel == 'true'
        env:
          CPANEL_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          CPANEL_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          CPANEL_PROTO: ${{ secrets.CPANEL_FTP_PROTOCOL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          PROTO="${CPANEL_PROTO:-ftp}"
          if [ -z "$CPANEL_PORT" ]; then
            if [ "$PROTO" = "sftp" ]; then
              PORT="22"
            else
              PORT="21"
            fi
          else
            PORT="$CPANEL_PORT"
          fi

          echo "Initiating deployment via protocol: $PROTO on port: $PORT"

          if [ "$PROTO" = "sftp" ]; then
            lftp -u "$CPANEL_USER","$CPANEL_PASS" -p "$PORT" "sftp://$CPANEL_SERVER" <<EOF
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 3
          mkdir -p storage
          mirror -R --verbose backend/cpanel_storage/ storage/
          quit
          EOF
          else
            lftp -u "$CPANEL_USER","$CPANEL_PASS" -p "$PORT" "$CPANEL_SERVER" <<EOF
          set ftp:ssl-allow true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          mkdir -p storage
          mirror -R --verbose backend/cpanel_storage/ storage/
          quit
          EOF
          fi
