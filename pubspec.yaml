name: rentalhub
description: "Enterprise Car Rental Marketplace and Fleet Management Platform in Pakistan."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management, Equatable & DI
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^9.3.0

  # Routing
  go_router: ^18.1.0

  # Firebase Suite
  firebase_core: ^3.10.0

  # Storage & Offline Cache
  shared_preferences: ^2.5.6
  # Phase B (B2/B3): connectivity awareness + a stable dir for
  # queued upload files that must survive a restart.
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.5

  # Networking & Cryptography (cPanel HMAC Uploads)
  http: ^1.6.0
  crypto: ^3.0.6

  # Formatting & Internationalization
  intl: ^0.20.2
  firebase_auth: ^5.7.0
  cloud_functions: ^5.4.0
  firebase_messaging: ^15.2.0
  cloud_firestore: ^5.6.12
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  geolocator: ^14.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_native_splash: ^2.4.4
  google_sign_in: ^6.2.2
  qr_flutter: ^4.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  signature: ^6.4.0
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.10.1

flutter_native_splash:
  color: "#0F1336"
  image: assets/images/rentalhub_splash_logo.png
  color_dark: "#0F1336"
  image_dark: assets/images/rentalhub_splash_logo.png
  android_12:
    color: "#0F1336"
    color_dark: "#0F1336"
    image: assets/images/rentalhub_splash_logo.png
    image_dark: assets/images/rentalhub_splash_logo.png
  fullscreen: true
  android: true
  ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
  # Phase A (A1): bundled fonts — Inter for Latin, Noto Nastaliq Urdu for
  # Urdu. Both are variable fonts; each weight entry points at the same
  # file and Flutter selects the instance from the wght axis.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
        - asset: assets/fonts/Inter.ttf
          weight: 800
    - family: Noto Nastaliq Urdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
          weight: 400
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
          weight: 700
