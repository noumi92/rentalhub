name: rentalhub
description: "Enterprise Car Rental Marketplace and Fleet Management Platform in Pakistan."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management, Equatable & DI
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^9.3.0

  # Routing
  go_router: ^18.1.0

  # Firebase Suite
  firebase_core: ^3.10.0

  # Storage & Offline Cache
  shared_preferences: ^2.5.6

  # Networking & Cryptography (cPanel HMAC Uploads)
  http: ^1.6.0
  crypto: ^3.0.6

  # Formatting & Internationalization
  intl: ^0.20.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
