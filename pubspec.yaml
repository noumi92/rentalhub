name: rentalhub
description: "Enterprise Car Rental Marketplace and Fleet Management Platform in Pakistan."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management, Equatable & DI
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^9.3.0

  # Routing
  go_router: ^18.1.0

  # Firebase Suite
  firebase_core: ^3.10.0

  # Storage & Offline Cache
  shared_preferences: ^2.5.6

  # Networking & Cryptography (cPanel HMAC Uploads)
  http: ^1.6.0
  crypto: ^3.0.6

  # Formatting & Internationalization
  intl: ^0.20.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  image_picker: ^1.2.4
  geolocator: ^14.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_native_splash: ^2.4.4
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#0F1336"
  image: assets/images/rentalhub_splash_logo.png
  color_dark: "#0F1336"
  image_dark: assets/images/rentalhub_splash_logo.png
  android_12:
    color: "#0F1336"
    color_dark: "#0F1336"
    image: assets/images/rentalhub_splash_logo.png
    image_dark: assets/images/rentalhub_splash_logo.png
  fullscreen: true
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
